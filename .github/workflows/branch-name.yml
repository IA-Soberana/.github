name: Nome da branch

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions:
  contents: read

jobs:
  validar:
    name: Validar nome da branch
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar padrão "nome_usuario/tipo/issue-descricao-curta"
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          PADRAO='^[^/]+/(feat|fix|doc|style|refactor|perf|test|build|ci|chore|revert)/[0-9]+-[a-z0-9-]+$'

          if [[ "$BRANCH_NAME" =~ $PADRAO ]]; then
            echo "Branch válida: $BRANCH_NAME"
            exit 0
          fi

          echo "::error::Branch fora do padrão: $BRANCH_NAME"
          echo ""
          echo "Formato: nome_usuario/tipo/issue-descricao-curta"
          echo "Tipos: feat, fix, doc, style, refactor, perf, test, build, ci, chore, revert"
          echo "Exemplo: notadson/feat/12-login-google"
          exit 1
