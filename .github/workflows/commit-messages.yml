name: Padrão de commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read

jobs:
  validar:
    name: Validar mensagens de commit
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar padrão "tipo #issue: mensagem"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PADRAO='^(feat|fix|doc|style|refactor|perf|test|build|ci|chore|revert) #[0-9]+: .+$'
          falhou=0

          while IFS= read -r assunto; do
            [[ -z "$assunto" ]] && continue

            # Reversões automáticas criadas pela interface do GitHub
            if [[ "$assunto" == 'Revert "'* ]]; then
              continue
            fi

            if [[ ! "$assunto" =~ $PADRAO ]]; then
              echo "::error::Commit fora do padrão: $assunto"
              falhou=1
            fi
          done < <(git log --no-merges --format='%s' "$BASE_SHA..$HEAD_SHA")

          if [[ $falhou -ne 0 ]]; then
            echo ""
            echo "Formato: tipo #issue: mensagem"
            echo "Tipos: feat, fix, doc, style, refactor, perf, test, build, ci, chore, revert"
            echo "Exemplo: feat #12: adiciona login com Google"
            exit 1
          fi

          echo "Todos os commits seguem o padrão."
